name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Build release
        env:
          MIX_ENV: prod
        run: mix release --overwrite

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          # Stop service before deploying new files
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "sudo systemctl stop sentinel || true"

          # Copy release to VPS
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            _build/prod/rel/sentinel/ \
            "$VPS_USER@$VPS_HOST:/opt/sentinel/"

          # Update systemd service file and start
          scp $SSH_OPTS deploy/sentinel.service "$VPS_USER@$VPS_HOST:/tmp/sentinel.service"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "sudo mv /tmp/sentinel.service /etc/systemd/system/sentinel.service && \
             sudo systemctl daemon-reload && \
             sudo systemctl enable sentinel && \
             sudo systemctl start sentinel"

          # Install scrape-snapshot cron (temporary forensic capture during
          # lance-certo scrape window — retire when S4 lands).
          scp $SSH_OPTS scripts/scrape-snapshot.sh "$VPS_USER@$VPS_HOST:/tmp/scrape-snapshot.sh"
          scp $SSH_OPTS deploy/scrape-snapshot.cron "$VPS_USER@$VPS_HOST:/tmp/scrape-snapshot.cron"
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
            "sudo install -m 755 -o root -g root /tmp/scrape-snapshot.sh /usr/local/bin/scrape-snapshot.sh && \
             sudo install -m 644 -o root -g root /tmp/scrape-snapshot.cron /etc/cron.d/scrape-snapshot && \
             sudo mkdir -p /var/log/scrape-monitor && \
             sudo chown sentinel:docker /var/log/scrape-monitor && \
             sudo chmod 755 /var/log/scrape-monitor && \
             rm -f /tmp/scrape-snapshot.sh /tmp/scrape-snapshot.cron"
